display_information:
  name: Report Messages Bot
  description: "Forwards messages reacted with :thermometer: into a thread in a triage channel"
  background_color: "#4a4a4a"
features:
  bot_user:
    display_name: Report Messages Bot
    always_online: false
  shortcuts:
    - name: Report CoC Violation
      type: message
      callback_id: review_message
      description: Review this message for code of conduct violations
    - name: Report spam
      type: message
      callback_id: report_spam
      description: Flag this message as potential spam orscam
oauth_config:
  scopes:
    bot:
      - reactions:read
      - channels:history
      - groups:history
      - chat:write
      - channels:read
      - groups:read
      - channels:join
      - im:write
      - mpim:write
      - groups:write
      - commands
settings:
  event_subscriptions:
    # Replace with your deployed Vercel URL once you have it
    request_url: https://assisted-eq-bot.vercel.app/api/slack/events
    bot_events:
      - reaction_added
  interactivity:
    is_enabled: true
    request_url: https://assisted-eq-bot.vercel.app/api/slack/events
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: false
