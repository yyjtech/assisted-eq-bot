display_information:
  name: Assisted EQ Bot
  description: "Forwards messages reacted with :thermometer: into a thread in a triage channel"
  background_color: "#4a4a4a"
features:
  bot_user:
    display_name: Assisted EQ Bot
    always_online: false
oauth_config:
  scopes:
    bot:
      - reactions:read
      - channels:history
      - groups:history
      - chat:write
      - channels:read
      - groups:read
      - channels:join
      - im:write
      - mpim:write
      - groups:write
settings:
  event_subscriptions:
    # Replace with your deployed Vercel URL once you have it
    request_url: https://assisted-eq-cc47ioc8x-yyj-tech.vercel.app/api/slack/events
    bot_events:
      - reaction_added
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: false
